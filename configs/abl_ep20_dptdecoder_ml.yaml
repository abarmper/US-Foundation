# DPT/RefineNet-style decoder WITH multi-level feature fusion.
#   model.neck.decoder = dpt  +  input_mode = multilevel  (dpt is multilevel-only)
#
# Unlike the simple decoder's undifferentiated channel-concat (abl_ep20_simplehead_ml)
# or HRNet's bidirectional-exchange-then-sum (abl_ep20_upgraded), this decoder gives
# each of the 4 DINOv2 depths its own projection and fuses them via an explicit top-down
# progressive fusion (coarsest-to-finest), each stage combining a per-depth-projected
# skip connection with the previous stage's output through residual conv units -- the
# actual DPT/RefineNet fusion mechanism. Reuses the same per-depth resolution assignment
# as hrnet-multilevel/simple-multilevel (g23->37, g17->74, {g11,g05}->148) so the
# featurization is identical across all three decoder ablations; only the fusion
# mechanism under test differs.
#
# Note: ~24M params (fusion_channels=256) -- heavier than BOTH hrnet-multilevel and
# simple-multilevel (~18M). Almost all of the extra weight is the 4 separate per-depth
# projections (the proj_g11/proj_g05 _DeconvX2 pair alone is ~10.5M), which is also
# exactly DPT's distinguishing idea vs. simple's undifferentiated concat. Given this
# project's results so far favor lighter decoders, this run tests whether depth-aware
# progressive fusion is worth the extra capacity, or repeats HRNet's "heavier loses"
# pattern. Compare against: abl_ep20_simplehead_ml (current best-blend champion, 0.0696),
# abl_ep20_upgraded_dv2ep20 (hrnet-multilevel on the same new-SSL encoder, 0.0842).
run_name: abl_ep20_dptdecoder_ml
phase: phase2
seed: 42
phase1_weights: runs/phase1_multicrop/checkpoints/dinov2_adapted_ep20.pth

model:
  backbone:
    name: dinov2_vitl14_reg
    unfreeze_last_n_blocks: 4
  neck:
    branch_width: [128, 96, 64]   # ignored by the dpt decoder
    dropout_p: 0.3
    input_mode: multilevel        # required by the dpt decoder (multilevel-only)
    feature_layers: [5, 11, 17, 23]
    shared_head: false
    decoder: dpt                  # DPT/RefineNet-style top-down progressive fusion
  heatmap_size: 148

data:
  data_root: data/data/train_data
  kfold_dir: splits/kfold_v1
  fold: 0
  batch_size: 64
  num_workers: 8
  canvas: 518
  sample_temp: 0.5

optim:
  lr: 2.0e-4
  encoder_lr_mult: 0.1
  llrd_decay: 0.75
  amp_dtype: bf16
  weight_decay: 1.0e-2
  epochs: 150
  warmup_epochs: 15
  softargmax_temp: 10.0
  loss_space: original
  dsnt_lambda: 0.1
  dsnt_type: js
  dsnt_sigma: 1.0
  early_stop_patience: 40
  select_metric: challenge_blend
