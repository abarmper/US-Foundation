# Single-model prediction on the real challenge val set -> submission.zip.
# Model: abl_ep20_simplehead_ml_dv2ep20 (NEW-SSL ep20 encoder, multilevel-concat
# simple decoder, full fine-tune) -- best-blend fold-0 result (0.0696 / MRE 25.98).
run_name: predict_challenge_dv2ep20
phase: predict

predict:
  member_run_dirs:
    - runs/abl_ep20_simplehead_ml_dv2ep20
  checkpoint_name: best_teacher_model.pth
  image_dir: data/data/val_data       # challenge <task>/<file> layout, no labels
  tta_canvases: [490, 518, 546]       # multi-scale TTA (all % 14 == 0)
  tta_intensity: true
  average_space: coord
  out_json: submission_dv2ep20.json
  zip_output: true
